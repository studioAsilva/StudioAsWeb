@let p = product();
<article class="card" [attr.aria-labelledby]="p.id + '-title'">
  <div class="card__media">
    <img
      class="card__image"
      [ngSrc]="p.image.src"
      [alt]="p.image.alt"
      [width]="p.image.width"
      [height]="p.image.height"
      [priority]="priority()"
    />
    @if (p.badge) {
      <span class="card__badge">{{ p.badge }}</span>
    }
    <button class="card__overlay-button" type="button" (click)="details.emit(p)">
      Ver detalhes<span class="visually-hidden">: {{ p.name }}</span>
    </button>
  </div>

  <div class="card__body">
    <h2 class="card__title" [id]="p.id + '-title'">{{ p.name }}</h2>
    <p class="card__text">{{ p.tagline }}</p>

    <div class="card__footer">
      @if (p.priceInCents !== undefined) {
        <p class="card__price">
          @if (p.compareAtPriceInCents) {
            <s class="card__price-old"
              ><span class="visually-hidden">De </span
              >{{ p.compareAtPriceInCents / 100 | currency }}</s
            >
            <span class="visually-hidden">por</span>
          }
          {{ p.priceInCents / 100 | currency }}
        </p>
      }
      <div class="card__actions">
        <button class="btn btn--outline btn--md" type="button" (click)="details.emit(p)">
          Detalhes
        </button>
        <button class="btn btn--primary btn--md" type="button" (click)="buy.emit(p)">
          {{ p.cardActionLabel ?? 'Comprar' }}
        </button>
      </div>
    </div>
  </div>
</article>
