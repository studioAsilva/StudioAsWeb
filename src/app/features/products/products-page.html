<section class="section section--soft page-header">
  <div class="container">
    <app-section-heading
      [eyebrow]="content.eyebrow"
      [title]="content.title"
      [subtitle]="content.subtitle"
      [level]="1"
      align="center"
    />
  </div>
</section>

<section class="section" aria-label="Lista de produtos">
  <div class="container categories">
    @for (group of groups; track group.id; let firstGroup = $first) {
      <section class="category" [attr.aria-labelledby]="'categoria-' + group.id">
        <h2 class="category__banner" [id]="'categoria-' + group.id">{{ group.title }}</h2>
        <ul class="products">
          @for (product of group.products; track product.id) {
            <li>
              <app-product-card
                [product]="product"
                [priority]="firstGroup && $first"
                (details)="detailsProduct.set($event)"
                (buy)="onBuy($event)"
              />
            </li>
          }
        </ul>
      </section>
    }
  </div>
</section>

@if (detailsProduct(); as product) {
  <app-product-details
    [product]="product"
    (buy)="onBuy($event)"
    (closed)="detailsProduct.set(null)"
  />
}

@if (checkoutProduct(); as product) {
  <app-checkout-dialog [product]="product" (closed)="checkoutProduct.set(null)" />
}

@if (compra() !== undefined) {
  <app-payment-return [product]="purchasedProduct()" (closed)="closePaymentReturn()" />
}
