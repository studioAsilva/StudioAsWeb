@let c = content();
<section class="hero" aria-labelledby="hero-title">
  <div class="hero__media">
    <img [ngSrc]="c.image.src" [alt]="c.image.alt" fill priority />
  </div>

  <div class="container hero__inner">
    <div class="hero__text">
      <p class="eyebrow">{{ c.eyebrow }}</p>
      <h1 id="hero-title" class="hero__title">
        {{ c.title }}
        <em class="hero__highlight">{{ c.titleHighlight }}</em>
      </h1>
      <p class="hero__subtitle">{{ c.subtitle }}</p>
      <p class="hero__description">{{ c.text }}</p>
      <div class="hero__actions">
        <app-cta-link [cta]="c.cta" />
        @if (c.secondaryCta; as secondary) {
          <app-cta-link [cta]="secondary" variant="outline" />
        }
      </div>
    </div>
  </div>
</section>
